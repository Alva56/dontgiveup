<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi Siswa - Ekskul Robotik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-gray-200 p-6 space-y-6"
    >
      <!-- Header -->
      <div class="text-center">
        <div
          class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl"
        >
          <i class="fa-solid fa-robot"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800">Absensi Ekskul Robotik</h1>
        <p class="text-xs text-gray-500 mt-1" id="tanggalAbsen">
          Memuat tanggal...
        </p>
      </div>

      <!-- Form Absensi -->
      <form id="formAbsensi" onsubmit="simpanAbsens(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Nama Lengkap</label
          >
          <input
            type="text"
            id="namaSiswa"
            placeholder="Masukkan nama kamu"
            required
            class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Kelas</label
          >
          <input
            type="text"
            id="kelasSiswa"
            placeholder="Contoh: X IPA 1 / 8B"
            required
            class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Status Kehadiran</label
          >
          <select
            id="statusHadir"
            class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >
            <option value="Hadir">Hadir</option>
            <option value="Izin">Izin</option>
            <option value="Sakit">Sakit</option>
          </select>
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition text-sm flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-paper-plane"></i> Kirim Absen
        </button>
      </form>

      <!-- Pesan Sukses (Sembunyi secara default) -->
      <div id="pesanSukses" class="hidden text-center py-6 space-y-3">
        <div
          class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-xl"
        >
          <i class="fa-solid fa-check"></i>
        </div>
        <h2 class="text-lg font-bold text-gray-800">Absensi Berhasil!</h2>
        <p class="text-xs text-gray-500">
          Data absensi kamu telah tersimpan. Selamat mengikuti kegiatan ekskul!
        </p>
      </div>
    </div>

    <script>
      // Menampilkan tanggal hari ini secara otomatis
      document.getElementById("tanggalAbsen").innerText =
        new Date().toLocaleDateString("id-ID", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });

      function simpanAbsens(e) {
        e.preventDefault();

        const nama = document.getElementById("namaSiswa").value;
        const kelas = document.getElementById("kelasSiswa").value;
        const status = document.getElementById("statusHadir").value;
        const waktu = new Date().toLocaleTimeString("id-ID");

        const dataAbsen = { nama, kelas, status, waktu };

        // Menyimpan data ke LocalStorage
        let rekapAbsen =
          JSON.parse(localStorage.getItem("rekap_absen_robotik")) || [];
        rekapAbsen.push(dataAbsen);
        localStorage.setItem("rekap_absen_robotik", JSON.stringify(rekapAbsen));

        // Sembunyikan form dan tampilkan pesan sukses
        document.getElementById("formAbsensi").classList.add("hidden");
        document.getElementById("pesanSukses").classList.remove("hidden");
      }
    </script>
  </body>
</html>
