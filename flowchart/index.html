<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Poster APD — Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1 class="title">SELAMATKAN DIRI DENGAN APD !</h1>

    <div class="poster">
      <div class="highlight-circle" aria-hidden="true">
        <div class="plus">+</div>
      </div>

      <div class="person">
        <div class="helmet"></div>

        <div class="head">
          <div class="glasses">
            <div class="lens left"></div>
            <div class="bridge"></div>
            <div class="lens right"></div>
          </div>

          <div class="mask"></div>
        </div>

        <div class="neck"></div>

        <div class="body"></div>

        <div class="arms">
          <div class="arm left"></div>
          <div class="arm right"></div>

          <div class="glove left-glove"></div>
          <div class="glove right-glove"></div>
        </div>

        <div class="legs">
          <div class="leg left-leg"></div>
          <div class="leg right-leg"></div>
        </div>

        <div class="boots">
          <div class="boot left-boot"></div>
          <div class="boot right-boot"></div>
        </div>

        <div class="ground"></div>
      </div>
    
      <div class="label label-helmet">HARD HAT<div>       <div class="arrow arrow-helmet"></div>
      <div class="label label-goggles">GOOGLES</div>  <div class="arrow arrow-goggles"></div>


      <div class="label label-mask">MASK</div>
      <div class="arrow arrow-mask"></div>

      <div class="label label-vest">SAFETY VEST</div>
      <div class="arrow arrow-vest"></div>

      <div class="label label-gloves">GLOVES</div>
      <div class="arrow arrow-gloves"></div>

      <div class="label label-boots">SAFETY BOOTS</div>
      <div class="arrow arrow-boots"></div>
    </div>
  </div>
</body>

</html>
