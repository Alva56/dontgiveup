<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <h1>Triangle Calculator</h1>
        <div class="input-group">
            <label>Side A:</label>
            <input type="number" id="sideA" min="0" step="any">
        </div>
        <div class="input-group">
            <label>Side B:</label>
            <input type="number" id="sideB" min="0" step="any">
        </div>
        <div class="input-group">
            <label>Side C:</label>
            <input type="number" id="sideC" min="0" step="any">
        </div>
        <button onclick="calculateTriangle()">Calculate</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
